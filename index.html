<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel Test</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .title {
            text-align: center;
            padding: 30px 15px 25px;
        }

        .title h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .title p {
            color: #bbb;
            margin-top: 10px;
            font-size: 14px;
        }

        .carousel {
            width: 100%;
            overflow: hidden;
            padding: 10px 0 35px;
        }

        .carousel-track {
            display: flex;
            width: max-content;
            gap: 18px;
            animation: scroll 12s linear infinite; /* <-- Adjusted speed here */
            will-change: transform;
        }

        .carousel:hover .carousel-track {
            animation-play-state: paused;
        }

        .slide {
            width: 420px;
            height: 300px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 18px;
            background: #222;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .slide img:hover {
            transform: scale(1.04);
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        @media (max-width: 600px) {
            .title {
                padding: 25px 12px 18px;
            }

            .title h1 {
                font-size: 24px;
            }

            .carousel-track {
                gap: 12px;
                animation-duration: 10s; /* <-- Adjusted mobile speed here */
            }

            .slide {
                width: 82vw;
                height: 250px;
                border-radius: 15px;
            }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .slide {
                width: 65vw;
                height: 320px;
            }
        }
    </style>
</head>

<body>

    <header class="title">
        <h1>📸 Our Image Gallery</h1>
        <p>A collection of our favourite moments</p>
    </header>

    <section class="carousel" aria-label="Automatic image gallery">
        <div class="carousel-track" id="carouselTrack">
            <div class="slide"><img src="photo1.jpg" alt="Gallery photo 1"></div>
            <div class="slide"><img src="photo2.jpg" alt="Gallery photo 2"></div>
            <div class="slide"><img src="photo3.jpg" alt="Gallery photo 3"></div>
            <div class="slide"><img src="photo4.jpg" alt="Gallery photo 4"></div>
            <div class="slide"><img src="photo5.jpg" alt="Gallery photo 5"></div>
            <div class="slide"><img src="photo6.jpg" alt="Gallery photo 6"></div>
            <div class="slide"><img src="photo7.jpg" alt="Gallery photo 7"></div>
            <div class="slide"><img src="photo8.jpg" alt="Gallery photo 8"></div>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const track = document.getElementById("carouselTrack");
            if (track) {
                track.innerHTML += track.innerHTML;
            }
        });
    </script>

</body>

</html>
