<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Image Carousel</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            background: #111;

            font-family: Arial, sans-serif;

            color: white;

            overflow-x: hidden;

        }


        /* ================= TITLE ================= */

        .title {

            text-align: center;

            padding: 30px 15px 20px;

        }


        .title h1 {

            font-size: 28px;

        }


        /* ================= CAROUSEL ================= */

        .carousel {

            width: 100%;

            overflow: hidden;

            padding: 10px 0 30px;

        }


        .carousel-track {

            display: flex;

            gap: 15px;

            width: max-content;

            animation: scroll 30s linear infinite;

        }


        /* ================= IMAGE ================= */

        .slide {

            width: 80vw;

            max-width: 500px;

            height: 300px;

            flex-shrink: 0;

            border-radius: 18px;

            overflow: hidden;

        }


        .slide img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* ================= AUTOMATIC SCROLL ================= */

        @keyframes scroll {

            0% {

                transform: translateX(0);

            }

            100% {

                transform: translateX(-50%);

            }

        }


        /* ================= PHONE ================= */

        @media (max-width: 600px) {

            .title h1 {

                font-size: 24px;

            }


            .carousel-track {

                gap: 10px;

                animation-duration: 25s;

            }


            .slide {

                width: 82vw;

                height: 250px;

                border-radius: 15px;

            }

        }


        /* ================= TABLET / DESKTOP ================= */

        @media (min-width: 601px) {

            .slide {

                height: 350px;

            }

        }

    </style>

</head>


<body>
